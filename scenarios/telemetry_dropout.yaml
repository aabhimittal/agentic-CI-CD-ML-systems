# A fleet telemetry outage mid-rollout — the metrics pipeline goes dark from
# step 1 onward while the rollout is in flight. Stale-but-green numbers must
# never count as evidence of health: the decision tree's fail-safe root HOLDs on
# missing telemetry, and when it doesn't recover within the hold budget the
# rollout escalates to a rollback. The candidate itself is perfectly healthy —
# the system still refuses to promote blind.
service: grasp-planner
model_version: grasp-net:v2.3.1
previous_version: grasp-net:v2.3.0
fleet_size: 60
task_criticality: 0.8
change_summary: "minor calibration update"
seed: 21

thresholds:
  max_error_rate: 0.05
  max_latency_p99_ms: 500
  min_task_success_rate: 0.90
  max_cycle_time_s: 12.0
  max_safety_incidents: 0

behavior:
  base_error_rate: 0.010
  base_latency_p99_ms: 180
  base_task_success_rate: 0.980
  base_cycle_time_s: 8.0
  cand_error_rate: 0.009
  cand_latency_p99_ms: 178
  cand_task_success_rate: 0.985
  cand_cycle_time_s: 7.9
  cand_safety_rate: 0.0
  # The metrics pipeline is down for these observation windows.
  telemetry_dropout_steps: [1, 2, 3, 4, 5]
  noise: 0.01
